name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (Eleventy → _site/)
        run: npm run build

      - name: Validações estáticas (rotas, arquitetura, HTML, links, busca, módulos)
        run: npm run test:static

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de navegador (fluxos, segurança, acessibilidade/axe)
        run: npm run test:e2e

      - name: Anexar resultados quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
